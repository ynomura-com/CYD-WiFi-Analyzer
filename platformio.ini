; CYD Wi-Fi Analyzer - ESP32-2432S028 (Cheap Yellow Display)
; VS Code + PlatformIO 用プロジェクト設定
;
; 使い方:
;   通常はそのまま (env:cyd) でビルド/書き込みしてください。
;   デュアルUSB版 (CYD2USB) で画面が出ない/色がおかしい場合は
;   右下の PlatformIO 環境切り替えで cyd2usb を選んでください。

[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
; TFT_eSPI の設定は User_Setup.h を編集せず、すべて build_flags で渡す。
; (レーダーアプリとまったく同じ設定なので、そちらが動いた環境ならそのまま動きます)
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; 標準の CYD (micro-USB のみ、ILI9341 系)
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1

; デュアルUSB版 CYD2USB (ST7789 系のロット用)
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
